name: "Synchronisation des Labels"

on:
  schedule:
    # 19h15 UTC quotidien (= 20h15 FR hiver / 21h15 FR été)
    - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Cible des repos"
        type: choice
        options: [all, latest]
        default: all
      dry_run:
        description: "Simulation sans appliquer les changements"
        type: boolean
        default: false
  repository_dispatch:
    types: [refresh]
  workflow_call:
    inputs:
      mode:
        description: "Cible: 'all' tous les repos non-archivés, 'latest' uniquement le dernier créé"
        type: string
        default: all
      dry_run:
        description: "Simulation sans appliquer les changements"
        type: boolean
        default: false
      labels_path:
        description: "Chemin vers le fichier labels.json"
        type: string
        default: .github/config/labels.json
      exclude_path:
        description: "Chemin vers exclude.json (optionnel)"
        type: string
        default: .github/config/exclude.json
    secrets:
      LABELGITHUB_TOKEN:
        required: true

concurrency:
  group: labelsync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  list-repos:
    name: 📋 Lister les repos cibles
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.collect.outputs.repos }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Vérifier le fichier labels
        env:
          LABELS_PATH: ${{ inputs.labels_path || '.github/config/labels.json' }}
        run: |
          set -euo pipefail
          if [ ! -f "$LABELS_PATH" ]; then
            echo "❌ $LABELS_PATH introuvable" >&2
            exit 1
          fi
          jq -e 'type == "array" and length > 0' "$LABELS_PATH" > /dev/null || {
            echo "❌ $LABELS_PATH n'est pas un tableau JSON non vide" >&2
            exit 1
          }
          echo "✅ $LABELS_PATH OK ($(jq 'length' "$LABELS_PATH") labels)"

      - name: 🔎 Collecter les repos cibles
        id: collect
        env:
          GH_TOKEN: ${{ secrets.LABELGITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'all' }}
          EXCLUDE_PATH: ${{ inputs.exclude_path || '.github/config/exclude.json' }}
        run: |
          set -euo pipefail
          echo "🔍 Récupération des repos (mode=$MODE)..."

          # Tri par date de création desc, ignore les archivés et les repos taggués 'no-labelsync'
          gh api 'user/repos?type=owner&sort=created&direction=desc&per_page=100' --paginate \
            --jq '[.[] | select(.archived == false) | select((.topics // []) | index("no-labelsync") | not) | .full_name]' \
            > candidates.json

          if [ -f "$EXCLUDE_PATH" ]; then
            echo "🚫 Application des exclusions ($EXCLUDE_PATH)"
            jq --slurpfile excl "$EXCLUDE_PATH" '. - (($excl[0].repos) // [])' candidates.json > filtered.json
          else
            cp candidates.json filtered.json
          fi

          if [ "$MODE" = "latest" ]; then
            jq '.[0:1]' filtered.json > final.json
          else
            cp filtered.json final.json
          fi

          COUNT=$(jq 'length' final.json)
          REPOS=$(jq -c . final.json)
          echo "✅ $COUNT repo(s) à traiter"
          jq -r '.[]' final.json | sed 's/^/  - /' || true
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

  sync:
    name: 🏷️ ${{ matrix.repo }}
    needs: list-repos
    if: needs.list-repos.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repo: ${{ fromJson(needs.list-repos.outputs.repos) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏷️ Synchroniser les labels
        # Pinner sur un SHA en production: cf. https://github.com/EndBug/label-sync/releases
        uses: EndBug/label-sync@v2
        with:
          config-file: ${{ inputs.labels_path || '.github/config/labels.json' }}
          repository: ${{ matrix.repo }}
          delete-other-labels: true
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ secrets.LABELGITHUB_TOKEN }}

  summary:
    name: 📊 Récapitulatif
    needs: [list-repos, sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Résumé
        run: |
          {
            echo "## Synchronisation des labels"
            echo ""
            echo "| Champ | Valeur |"
            echo "|---|---|"
            echo "| Repos ciblés | **${{ needs.list-repos.outputs.count }}** |"
            echo "| Mode | \`${{ inputs.mode || 'all' }}\` |"
            echo "| Dry-run | \`${{ inputs.dry_run || false }}\` |"
            echo "| Statut listing | \`${{ needs.list-repos.result }}\` |"
            echo "| Statut sync | \`${{ needs.sync.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
